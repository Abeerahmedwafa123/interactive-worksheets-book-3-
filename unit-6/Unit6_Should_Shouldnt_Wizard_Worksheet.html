<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><title>Worksheet</title><style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0c1a12;font-family:'Segoe UI',Calibri,system-ui,sans-serif;color:#eafff0;padding:14px;}
.wrap{max-width:980px;margin:0 auto;}
.hbar{background:linear-gradient(90deg,#16361f,#0f2a18);border:1px solid #2f6b3e;border-radius:12px;
  padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;}
.hbar h1{font-size:18px;color:#ffd873;}
.hbar .sub{font-size:12.5px;color:#bfe6c8;}
.namewrap{display:flex;align-items:center;gap:8px;}
.namewrap label{font-size:13px;color:#bfe6c8;font-weight:700;}
input.name{padding:7px 10px;border-radius:8px;border:1px solid #3f7d50;background:#0e2417;color:#fff;font-size:14px;min-width:170px;}

.board{position:relative;width:min(980px,96vw);aspect-ratio:1536/2730;margin:0 auto;border-radius:14px;overflow:hidden;
  background-size:cover;background-position:center;container-type:inline-size;box-shadow:0 8px 30px rgba(0,0,0,.5);}
.ribbon{display:none !important;position:absolute;left:13%;top:12%;width:74%;height:7%;display:flex;align-items:center;justify-content:center;
  text-align:center;color:#ffdf8a;font-weight:800;font-size:2.4cqw;text-shadow:0 2px 4px rgba(0,0,0,.7);letter-spacing:.3px;}

.q{position:absolute;background:rgba(7,18,12,.70);border:0.18cqw solid var(--ac,#7fd39a);border-radius:1.2cqw;
  padding:0.9cqw 1.1cqw;color:#f1fff4;overflow:hidden;backdrop-filter:blur(1px);}
.q.ch1{left:40%;top:27.5%;width:46%;height:8.1%;--ac:#5fd6e0;}
.q.ch2{left:38.5%;top:43.2%;width:55%;height:7.6%;--ac:#74de80;}
.q.ch3{left:38%;top:58.3%;width:40%;height:7.5%;--ac:#7fb0ff;}
.q.ch4{left:21%;top:74.2%;width:45%;height:9.0%;--ac:#f0b24a;}
.q .prompt{font-size:1.5cqw;font-weight:700;line-height:1.14;margin-bottom:0.35cqw;}
.q .opts{display:flex;flex-direction:column;gap:0.3cqw;}
.opt{font-size:1.35cqw;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:0.6cqw;
  padding:0.24cqw 0.55cqw;cursor:pointer;line-height:1.08;}
.opt.sel{outline:0.22cqw solid var(--ac);}
.opt.ok{background:rgba(74,222,128,.38);border-color:#4ade80;}
.opt.no{background:rgba(255,110,90,.34);border-color:#ff6e5a;}
.gap{font-size:1.45cqw;line-height:1.35;}
.gap input{font-size:1.4cqw;padding:0.25cqw 0.5cqw;border-radius:0.5cqw;border:1px solid var(--ac);
  background:#0c2014;color:#fff;width:7.5cqw;text-align:center;font-weight:700;}
.gap input.ok{background:rgba(74,222,128,.30);} .gap input.no{background:rgba(255,110,90,.30);}
textarea.write{width:100%;height:4.6cqw;resize:none;font-size:1.35cqw;border-radius:0.6cqw;border:1px solid var(--ac);
  background:rgba(8,22,14,.8);color:#fff;padding:0.5cqw 0.7cqw;font-family:inherit;}
.row{display:flex;align-items:center;gap:0.6cqw;margin-top:0.3cqw;}
.check{font-size:1.25cqw;font-weight:800;color:#06140b;background:var(--ac);border:none;border-radius:0.6cqw;
  padding:0.26cqw 0.75cqw;cursor:pointer;}
.fb{font-size:1.3cqw;font-weight:700;display:none;line-height:1.12;}
.fb.show{display:block;}
.say{background:none;border:none;cursor:pointer;font-size:1.25cqw;padding:0 0.2cqw;line-height:1;} .fb.ok{color:#8ff0a6;} .fb.no{color:#ff9c86;}

.foot{margin-top:14px;background:linear-gradient(90deg,#16361f,#0f2a18);border:1px solid #2f6b3e;border-radius:12px;padding:14px 16px;}
.foot .line{display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
.foot label{font-size:13px;font-weight:700;color:#bfe6c8;}
input.wa{padding:8px 11px;border-radius:8px;border:1px solid #3f7d50;background:#0e2417;color:#fff;font-size:14px;min-width:210px;}
.send{background:#25D366;color:#06240f;font-weight:800;border:none;border-radius:10px;padding:11px 18px;font-size:15px;cursor:pointer;}
.send:hover{filter:brightness(1.05);}
.score{font-size:15px;font-weight:800;color:#ffd873;margin-left:auto;}
.hint{font-size:12px;color:#9fd4ab;margin-top:8px;}

const D = {"topic": "should / shouldn't", "title": "should / shouldn't", "ribbon": "should / shouldn't", "ribbon_is_image": false, "whatsapp_default": "", "chambers": {"ch1": {"type": "mcq", "label": "Meaning", "prompt": "'You should listen to your teacher.' What does 'should' show?", "options": [{"t": "It is a good idea - advice", "correct": true}, {"t": "It happened in the past", "correct": false}, {"t": "It is not allowed - a rule", "correct": false}], "fb_ok": "should = a good idea; shouldn't = not a good idea.", "fb_no": "should gives friendly advice - a good idea."}, "ch2": {"type": "gap", "label": "Form", "prompt": "Complete with should or shouldn't:", "items": [{"before": "To do well, you", "after": "study hard.", "answer": "should", "accept": ["should"]}, {"before": "You", "after": "copy in exams.", "answer": "shouldn't", "accept": ["shouldn't", "shouldnt", "should not"]}], "fb_ok": "should + verb for a good idea; shouldn't for a bad idea."}, "ch3": {"type": "mcq", "label": "Pronunciation", "prompt": "How do we say 'should'?", "say_phrase": "You should listen to your teacher.", "options": [{"t": "silent l: 'shood'", "say": "should", "rate": 1.0, "correct": true}, {"t": "say the l: 'shoold'", "say": "shoold", "rate": 0.8, "correct": false}, {"t": "'shawld'", "say": "shawld", "rate": 0.8, "correct": false}], "fb_ok": "Yes! The 'l' is silent: say 'shood' /ʃʊd/.", "fb_no": "The 'l' is silent: 'shood', not 'shoold'."}, "ch4": {"type": "write", "label": "Writing", "prompt": "Give a friend two pieces of advice for school: one with should, one with shouldn't.", "checks": [{"pattern": "should\\s+\\w+", "label": "should + verb"}, {"pattern": "shouldn'?t\\s+\\w+", "label": "shouldn't + verb"}], "min_words": 8, "fb_ok": "Great advice! You used should and shouldn't well."}}};
const board = document.getElementById('board');
function norm(s){return (s||'').toLowerCase().trim().replace(/[.!?,;:'"]/g,'').replace(/\s+/g,' ');}
const RESULT = {};

function speak(t,r){try{var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r||0.95;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}catch(e){}}

function buildMCQ(id, q){
  const root = document.getElementById(id);
  let h = '<div class="prompt">'+q.prompt+(q.say_phrase?' <button class="say" data-say="'+q.say_phrase+'" title="Listen">🔊</button>':'')+'</div><div class="opts">';
  q.options.forEach((o,i)=>{ h += '<div class="opt" data-i="'+i+'">'+(o.say?'<button class="say" data-say="'+o.say+'" data-rate="'+(o.rate||0.95)+'" title="Listen">🔊</button> ':'')+o.t+'</div>'; });
  h += '</div><div class="row"><button class="check">Check</button><span class="fb"></span></div>';
  root.innerHTML = h;
  root.querySelectorAll('.say').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); speak(b.dataset.say, parseFloat(b.dataset.rate)||0.95); }));
  let sel = -1;
  const opts = root.querySelectorAll('.opt');
  opts.forEach(o=>o.addEventListener('click',()=>{ if(root.dataset.done)return; sel=+o.dataset.i;
    opts.forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); }));
  root.querySelector('.check').addEventListener('click',()=>{
    if(sel<0){flash(root,'Pick an answer first.');return;}
    const ok=q.options[sel].correct; root.dataset.done='1';
    opts[sel].classList.add(ok?'ok':'no');
    if(!ok){ q.options.forEach((o,i)=>{ if(o.correct) opts[i].classList.add('ok'); }); }
    const fb=root.querySelector('.fb'); fb.textContent=ok?('✔ '+(q.fb_ok||'Correct!')):('✗ '+(q.fb_no||'Not quite.'));
    fb.className='fb show '+(ok?'ok':'no');
    RESULT[id]={label:q.label, answer:q.options[sel].t, correct:ok, graded:true};
  });
  RESULT[id]={label:q.label, answer:'(no answer)', correct:false, graded:true};
}
function buildGAP(id, q){
  const root=document.getElementById(id);
  const items=q.items||[{before:q.before,after:q.after,answer:q.answer,accept:q.accept}];
  let h='<div class="prompt">'+q.prompt+'</div>';
  items.forEach((it,i)=>{ h+='<div class="gap">'+it.before+' <input type="text" placeholder="?"> '+it.after+'</div>'; });
  h+='<div class="row"><button class="check">Check</button><span class="fb"></span></div>';
  root.innerHTML=h;
  root.querySelector('.check').addEventListener('click',()=>{
    let allOk=true, answers=[];
    const inps=root.querySelectorAll('input');
    items.forEach((it,i)=>{
      const ok=(it.accept||[it.answer]).some(a=>norm(a)===norm(inps[i].value));
      inps[i].classList.remove('ok','no'); inps[i].classList.add(ok?'ok':'no');
      if(!ok)allOk=false; answers.push(inps[i].value||'(blank)');
    });
    const fb=root.querySelector('.fb');
    fb.textContent=allOk?('✔ '+(q.fb_ok||'Correct!')):('✗ Answers: '+items.map(it=>it.answer).join(' / '));
    fb.className='fb show '+(allOk?'ok':'no');
    RESULT[id]={label:q.label, answer:answers.join(' | '), correct:allOk, graded:true};
  });
  RESULT[id]={label:q.label, answer:'(blank)', correct:false, graded:true};
}
function buildWRITE(id, q){
  const root=document.getElementById(id);
  root.innerHTML='<div class="prompt">'+q.prompt+'</div><textarea class="write" placeholder="Write here..."></textarea>'+
    '<div class="row"><button class="check">Check</button><span class="fb"></span></div>';
  const ta=root.querySelector('textarea');
  ta.addEventListener('input',()=>{ const r=RESULT[id]||{}; RESULT[id]={label:q.label, answer:ta.value, correct:r.correct||null, graded:r.graded||false}; });
  root.querySelector('.check').addEventListener('click',()=>{
    const txt=ta.value.trim(); const words=txt?txt.split(/\s+/).length:0;
    let missing=[];
    (q.checks||[]).forEach(c=>{ if(!(new RegExp(c.pattern,'i')).test(txt)) missing.push(c.label); });
    if(words<(q.min_words||8)) missing.push('write at least '+(q.min_words||8)+' words');
    const ok=missing.length===0;
    const fb=root.querySelector('.fb');
    fb.textContent= ok ? ('✔ '+(q.fb_ok||'Wonderful! Now send it to your teacher.')) : ('✗ Add: '+missing.join(', '));
    fb.className='fb show '+(ok?'ok':'no');
    RESULT[id]={label:q.label, answer:txt||'(blank)', correct:ok, graded:true};
  });
  RESULT[id]={label:q.label, answer:'', correct:null, graded:false};
}
function flash(root,msg){ const fb=root.querySelector('.fb'); if(fb){fb.textContent=msg;fb.className='fb show no';} }

(function(){
  document.title = D.title + ' — Worksheet';
  if(!D.ribbon_is_image){ document.getElementById('ribbon').textContent = D.ribbon || D.topic; }
  var _t=document.getElementById('wsTitle'); if(_t){_t.textContent = D.title;}
  if(D.whatsapp_default) document.getElementById('wa').value = D.whatsapp_default;
  const c=D.chambers;
  ({mcq:buildMCQ,gap:buildGAP,write:buildWRITE})[c.ch1.type]('ch1',c.ch1);
  ({mcq:buildMCQ,gap:buildGAP,write:buildWRITE})[c.ch2.type]('ch2',c.ch2);
  ({mcq:buildMCQ,gap:buildGAP,write:buildWRITE})[c.ch3.type]('ch3',c.ch3);
  ({mcq:buildMCQ,gap:buildGAP,write:buildWRITE})[c.ch4.type]('ch4',c.ch4);
})();

function score(){ let n=0,t=0; for(const k in RESULT){ if(RESULT[k].graded){t++; if(RESULT[k].correct)n++;} } return [n,t]; }
function refreshScore(){ const [n,t]=score(); document.getElementById('score').textContent='Score: '+n+' / '+t; }
document.getElementById('board').addEventListener('click', ()=>setTimeout(refreshScore,30));

document.getElementById('send').addEventListener('click',()=>{
  const name=(document.getElementById('sname').value||'').trim();
  let num=(document.getElementById('wa').value||'').replace(/[^0-9]/g,'');
  if(!num){ alert("Please enter your teacher's WhatsApp number (with country code)."); return; }
  if(!name){ alert('Please write your name first.'); return; }
  const [n,t]=score();
  let msg='*Monglish Worksheet — '+D.title+'*\n';
  msg+='Student: '+name+'\n\n';
  let i=1;
  ['ch1','ch2','ch3','ch4'].forEach(k=>{
    const r=RESULT[k]; if(!r) return;
    let mark = r.graded ? (r.correct?'✔':'✗') : '✎';
    msg+=i+') '+r.label+': '+(r.answer||'(blank)')+'  '+mark+'\n';
    i++;
  });
  msg+='\nScore: '+n+' / '+t;
  window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank');
});
</script></body></html>
